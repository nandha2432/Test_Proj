<!DOCTYPE html>
<html>
<head>
    <title>Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }

        /* LEFT MENU */
        .sidebar {
            width: 220px;
            background-color: #1e1e2f;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            margin-top: 0;
        }

        .menu-item {
            padding: 10px;
            margin: 10px 0;
            cursor: pointer;
            border-radius: 5px;
        }

        .menu-item:hover {
            background-color: #33334d;
        }

        /* RIGHT CONTENT */
        .content {
            flex: 1;
            padding: 40px;
            background-color: #f4f4f4;
        }
    </style>
</head>

<body>

    <!-- LEFT MENU -->
    <div class="sidebar">
        <h2>Dashboard</h2>

        <div class="menu-item">Home</div>
        <div class="menu-item">Profile</div>
        <div class="menu-item">Settings</div>
        <div class="menu-item">Logout</div>
    </div>

    <!-- RIGHT CONTENT -->
    <div class="content">
        <h1>Welcome! You are logged in 🎉</h1>
        <p>This is your main dashboard area.</p>
    </div>

</body>
</html>
